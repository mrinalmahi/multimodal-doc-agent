<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0e11;
    --bg-panel: #1b1d22;
    --bubble-user: #2a2c33;
    --bubble-agent: #232017;
    --ink: #e9e5da;
    --ink-dim: #8c8a83;
    --rule: #2c2e34;
    --gold: #c9a15a;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    margin: 0;
    padding: 0;
  }

  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    font-family: 'Source Serif 4', Georgia, serif;
    color: var(--ink);
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 28px 100px;
    line-height: 1.55;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
  }

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 28px;
  }

  #upload-section {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 18px 0;
    margin-bottom: 18px;
    background: rgba(13, 14, 17, 0.55);
    backdrop-filter: blur(6px);
  }

  .upload-row { display: flex; gap: 10px; align-items: center; }

  input[type="file"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-dim);
    flex: 1;
  }

  input[type="file"]::file-selector-button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }

  button:hover { background: var(--gold); color: #0d0e11; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: none; color: var(--gold); }

  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin-top: 10px;
    min-height: 1em;
  }

  #document-list { margin-bottom: 20px; display: flex; flex-wrap: wrap; }
  #document-list:empty { margin-bottom: 0; }

  .doc-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink);
    background: rgba(27, 29, 34, 0.75);
    backdrop-filter: blur(4px);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 5px 12px;
    margin: 0 8px 8px 0;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .doc-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

  #chat-section { display: none; }

  #chat-log {
    max-height: 65vh;
    overflow-y: auto;
    margin-bottom: 16px;
    padding: 8px 8px 8px 0;
    display: flex;
    flex-direction: column;
  }

  .msg-row { display: flex; margin-bottom: 16px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { justify-content: flex-start; }
  .msg-row.system { justify-content: center; }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 0.95rem;
    backdrop-filter: blur(4px);
  }

  .bubble.has-image {
    max-width: 92%;
  }

  .bubble .tag {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.64rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.65;
  }

  .user .bubble {
    background: rgba(42, 44, 51, 0.85);
    color: var(--ink);
    border-bottom-right-radius: 3px;
  }

  .agent .bubble {
    background: rgba(35, 32, 23, 0.85);
    color: var(--ink);
    border: 1px solid #33301f;
    border-bottom-left-radius: 3px;
  }

  .system .bubble {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-align: center;
    padding: 4px 0;
  }

  .user .tag { color: var(--ink-dim); }
  .agent .tag { color: var(--gold); }

  .error .bubble {
    background: rgba(42, 28, 28, 0.85);
    border: 1px solid #5a3333;
    color: #d99;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
  }

  .image-frame {
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: #fff;
  }

  .image-frame img {
    display: block;
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    background: #fff;
  }

  .image-caption {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-dim);
    text-align: center;
    padding: 6px 0 2px;
    background: rgba(27, 29, 34, 0.9);
  }

  /* ---- thinking indicator ---- */
  .thinking .bubble {
    background: rgba(35, 32, 23, 0.85);
    border: 1px solid #33301f;
    border-bottom-left-radius: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
  }

  .thinking-face {
    font-size: 1.1rem;
    display: inline-block;
    animation: think-tilt 1.6s ease-in-out infinite;
    filter: grayscale(0.3) sepia(0.3) hue-rotate(-10deg);
  }

  .thinking-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .thinking-dots::after {
    content: '';
    display: inline-block;
    width: 1.4ch;
    text-align: left;
    animation: think-dots 1.4s steps(4, end) infinite;
  }

  @keyframes think-tilt {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-8deg) translateY(-1px); }
    50% { transform: rotate(0deg) translateY(0); }
    75% { transform: rotate(8deg) translateY(-1px); }
  }

  @keyframes think-dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }

  .input-row {
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }

  input[type="text"] {
    flex: 1;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 0.95rem;
    padding: 12px 4px;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
  }

  input[type="text"]::placeholder { color: var(--ink-dim); }
  input[type="text"]:focus { outline: none; border-bottom: 1px solid var(--gold); }
  input[type="text"]:disabled { opacity: 0.5; }

  #chat-log::-webkit-scrollbar { width: 6px; }
  #chat-log::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="page">
  <h1>Document Agent</h1>
  <div class="subtitle">upload papers — ask about any of them</div>

  <div id="upload-section">
    <div class="upload-row">
      <input type="file" id="pdf-file" accept="application/pdf">
      <button onclick="uploadDocument()">Upload</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="document-list"></div>

  <div id="chat-section">
    <div id="chat-log"></div>
    <div class="input-row">
      <input type="text" id="question-input" placeholder="Ask a question about any uploaded document...">
      <button id="send-btn" onclick="askQuestion()">Send</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("particle-canvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function initParticles() {
  const count = Math.floor((canvas.width * canvas.height) / 18000);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      alpha: Math.random() * 0.4 + 0.15
    });
  }
}
initParticles();
window.addEventListener("resize", initParticles);

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201, 161, 90, ${p.alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

const API_BASE = "http://127.0.0.1:8000";
let uploadedDocuments = [];
let conversationHistory = [];

function renderDocumentList() {
  const listDiv = document.getElementById("document-list");
  listDiv.innerHTML = uploadedDocuments
    .map(d => `<span class="doc-chip"><span class="dot"></span>${d.filename}</span>`)
    .join("");
}

async function uploadDocument() {
  const fileInput = document.getElementById("pdf-file");
  const statusDiv = document.getElementById("status");

  if (!fileInput.files.length) {
    statusDiv.textContent = "Please choose a PDF first.";
    return;
  }

  const filename = fileInput.files[0].name;
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  statusDiv.textContent = `Uploading "${filename}"... this may take a moment.`;

  try {
    const response = await fetch(`${API_BASE}/documents`, { method: "POST", body: formData });

    if (!response.ok) {
      const errorData = await response.json();
      statusDiv.textContent = `Error: ${errorData.detail}`;
      return;
    }

    const data = await response.json();
    uploadedDocuments.push({ document_id: data.document_id, filename });
    renderDocumentList();
    statusDiv.textContent = "";
    fileInput.value = "";

    document.getElementById("chat-section").style.display = "block";
    appendBubble("system", "", `Added "${filename}" — you can now ask about it.`);

  } catch (err) {
    statusDiv.textContent = `Upload failed: ${err.message}`;
  }
}

function appendBubble(role, tag, text, imageBase64, imageCaption) {
  const chatLog = document.getElementById("chat-log");
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;

  const bubbleClass = imageBase64 ? "bubble has-image" : "bubble";
  let innerHtml = tag
    ? `<div class="${bubbleClass}"><span class="tag">${tag}</span>${text}`
    : `<div class="${bubbleClass}">${text}`;

  if (imageBase64) {
    innerHtml += `
      <div class="image-frame">
        <img src="data:image/png;base64,${imageBase64}" alt="${imageCaption || 'image'}">
        ${imageCaption ? `<div class="image-caption">${imageCaption}</div>` : ""}
      </div>`;
  }
  innerHtml += `</div>`;

  row.innerHTML = innerHtml;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

function showThinking() {
  const chatLog = document.getElementById("chat-log");
  const row = document.createElement("div");
  row.className = "msg-row agent thinking";
  row.innerHTML = `
    <div class="bubble">
      <span class="thinking-face">🤔</span>
      <span class="thinking-label thinking-dots">thinking</span>
    </div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

async function askQuestion() {
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const question = input.value.trim();
  if (!question || uploadedDocuments.length === 0) return;

  conversationHistory.push({ role: "user", content: question });
  appendBubble("user", "you", question);
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;

  const thinkingRow = showThinking();

  const documentIds = uploadedDocuments.map(d => d.document_id);
  const documentLabels = Object.fromEntries(uploadedDocuments.map(d => [d.document_id, d.filename]));

  try {
    const response = await fetch(`${API_BASE}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        document_ids: documentIds,
        document_labels: documentLabels,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    thinkingRow.remove();

    if (!response.ok) {
      appendBubble("agent error", "error", data.detail);
    } else {
      conversationHistory.push({ role: "assistant", content: data.answer });
      appendBubble("agent", "agent", data.answer, data.image_base64, data.image_caption);
    }

  } catch (err) {
    thinkingRow.remove();
    appendBubble("agent error", "error", err.message);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById("question-input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") askQuestion();
});
</script>

</body>
</html>
